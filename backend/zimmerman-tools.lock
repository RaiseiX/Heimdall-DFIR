# zimmerman-tools.lock — ce que le build a le droit de telecharger.
#
# download.ericzimmermanstools.com ne publie que « latest » : il n'existe aucune
# URL versionnee. Verifie le 2026-09-18 :
#   /net9/MFTECmd_2026.5.0.zip  -> 404
#   /net9/2026.5.0/MFTECmd.zip  -> 404
# Le seul verrouillage possible est donc par empreinte, et c'est ce fichier.
#
# Le Dockerfile telecharge exactement cette liste puis passe `sha256sum -c`
# dessus. Une archive qui a bouge amont fait ECHOUER le build. C'est voulu :
# adopter une nouvelle version d'un parseur forensique change ce qui sort des
# scellés, donc c'est une decision, pas un effet de bord d'un rebuild. Avant
# ceci, quinze telechargements etaient suivis d'un `|| echo "Failed"` et une
# image sans aucun outil sortait verte.
#
# Pour adopter une nouvelle version amont :
#   bash backend/scripts/relock-zimmerman.sh
# puis relire le diff, rebuild, et comparer la sortie sur un cas connu.
#
# LIMITE, a connaitre : une empreinte detecte un changement amont, elle ne
# permet pas de re-telecharger l'ancienne version une fois qu'elle a disparu du
# serveur. Une reconstruction a l'identique d'une image ancienne exige de
# vendoriser les archives ou d'en garder un miroir.
#
# BitsParser est absent de cette liste : /net9/BitsParser.zip rend 404 et l'a
# toujours rendu. C'est un outil Python de Mandiant, pas un outil .NET d'Eric
# Zimmerman — il figurait dans la liste par erreur et le `|| echo` masquait
# l'echec a chaque build. Voir parserService.ts (parseur `bits`), qui declare
# donc une capacite que rien ne fournit.
#
# Versions relevees dans l'image du 2026-09-17 (dotnet <outil>.dll --help).
