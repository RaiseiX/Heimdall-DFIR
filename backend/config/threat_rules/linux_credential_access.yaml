# Linux Credential Access pack — T1003 / T1552
rules:
  - id: lnx_shadow_access
    name: "Password hash database accessed"
    severity: high
    category: credential-access
    target_artifact: [catscale_history, catscale_process, catscale_auditd, catscale_persistence]
    mitre: [T1003.008]
    tags: [CredentialAccess, ShadowFile]
    match:
      any:
        - { field: description, op: iregex, value: '/etc/(shadow|gshadow)\b' }

  - id: lnx_ssh_private_key_access
    name: "SSH private key read or copied"
    severity: high
    category: credential-access
    target_artifact: [catscale_history, catscale_process, catscale_auditd, catscale_fstimeline]
    mitre: [T1552.004]
    tags: [CredentialAccess, SSH, PrivateKey]
    match:
      any:
        - { field: description, op: iregex, value: '\.ssh/id_(rsa|dsa|ecdsa|ed25519)\b' }
        - { field: description, op: iregex, value: '\.ssh/identity\b' }
        - { field: description, op: iregex, value: '\b(cat|cp|scp|tar|base64)\b[^;|]*\.ssh/' }

  - id: lnx_proc_mem_dump
    name: "Process memory dumped"
    severity: high
    category: credential-access
    target_artifact: [catscale_history, catscale_process, catscale_auditd]
    mitre: [T1003.007]
    tags: [CredentialAccess, MemoryDump]
    match:
      any:
        - { field: description, op: iregex, value: '\bgcore\b' }
        - { field: description, op: iregex, value: '/proc/[0-9]+/mem\b' }
        - { field: description, op: iregex, value: '\b(mimipenguin|lazagne|3snake|swap_digger)\b' }
        - { field: description, op: iregex, value: '\bdd\b[^;]*if=/proc/' }

  - id: lnx_cleartext_credential_cmd
    name: "Credential passed in clear text on the command line"
    severity: medium
    category: credential-access
    target_artifact: [catscale_history, catscale_process, catscale_auditd, catscale_persistence]
    mitre: [T1552.001]
    tags: [CredentialAccess, CleartextCredential]
    match:
      any:
        - { field: description, op: iregex, value: '\bsshpass\s+-p' }
        - { field: description, op: iregex, value: '\bmysql\b[^;]*\s-p\S' }
        - { field: description, op: iregex, value: '\bcurl\b[^;]*\s-u\s+\S+:\S+' }
        - { field: description, op: iregex, value: '\bwget\b[^;]*--password[= ]' }
