# Timeline keyword enrichment rules (v3.0, Heimdall DFIR).
# Each rule attaches one or more tags when its regex matches either a specific
# list of fields or (if `fields` is omitted) the concatenation of every value
# in the record + description. Tags match the frontend WB_TAGS palette so the
# SuperTimeline grid colours them consistently.
#
# Fields available on a CSV record depend on the artifact:
#   - evtx (EvtxECmd): EventId, Channel, MapDescription, PayloadData1..6, Computer
#   - mft   (MFTECmd):  FileName, Extension, FullPath
#   - prefetch (PECmd): ExecutableName, SourceFilename
#   - hayabusa:         RuleTitle, Level, Channel, Details
#   - chainsaw:         detection.name, document.data.Event.EventData.*
#
# The matcher is case-insensitive by default (flags: "i"). Regexes follow
# JavaScript syntax. Keep patterns tight — they run on every ingested row.

rules:
  # ─── Execution / LOLBins ──────────────────────────────────────────────────
  - name: powershell_download_cradle
    pattern: "(invoke-webrequest|downloadstring|iex\\s*\\(|invoke-expression|net\\.webclient)"
    tags: [exec, suspicious, t1059.001]

  - name: lolbin_usage
    pattern: "\\b(mshta|rundll32|regsvr32|certutil|bitsadmin|wmic|cscript|wscript|installutil|msxsl|msbuild)\\b"
    tags: [exec, defense_evasion, t1218]

  - name: psexec_artifact
    pattern: "(psexesvc|psexec\\.exe|paexec)"
    tags: [lateral, exec, t1569.002]

  - name: encoded_powershell
    pattern: "(-enc(odedcommand)?\\s+[A-Za-z0-9+/=]{20,}|FromBase64String)"
    tags: [exec, defense_evasion, t1027]

  # ─── Credential access ────────────────────────────────────────────────────
  - name: mimikatz_markers
    pattern: "(mimikatz|sekurlsa|logonpasswords|kerberos::list|lsadump|gentilkiwi)"
    tags: [credential, critical, t1003.001]

  - name: dcsync
    pattern: "(dcsync|lsadump::dcsync|DRSUAPI)"
    tags: [credential, t1003.006]

  - name: kerberoasting
    pattern: "(klist|getspn|AS-REP\\sroasting|kerberoast)"
    tags: [credential, t1558.003]

  - name: ntds_dump
    pattern: "(ntds\\.dit|ntdsutil|vssadmin\\s+create\\s+shadow)"
    tags: [credential, t1003.003]

  # ─── Persistence ──────────────────────────────────────────────────────────
  - name: scheduled_task
    pattern: "(schtasks\\s+/create|at\\.exe|Register-ScheduledTask|taskeng\\.exe)"
    tags: [persist, t1053.005]

  - name: service_install
    pattern: "(sc\\s+create|New-Service|Install-Service|service\\s+installed)"
    fields: [MapDescription, PayloadData1, PayloadData2, description]
    tags: [persist, t1543.003]

  - name: registry_run_key
    pattern: "(\\\\Run\\\\|\\\\RunOnce\\\\|\\\\Winlogon\\\\|\\\\Userinit|\\\\AppInit_DLLs)"
    tags: [persist, t1547.001]

  - name: wmi_persistence
    pattern: "(__EventFilter|CommandLineEventConsumer|ActiveScriptEventConsumer|CmdConsumer|ScriptConsumer|CommandLineTemplate|ScriptText)"
    tags: [persist, t1546.003]

  # ─── Defense evasion ──────────────────────────────────────────────────────
  - name: event_log_clear
    pattern: "(wevtutil\\s+cl|Clear-EventLog|Remove-EventLog)"
    tags: [defense_evasion, critical, t1070.001]

  - name: shadow_copy_delete
    pattern: "(vssadmin\\s+delete\\s+shadows|wmic\\s+shadowcopy\\s+delete|Remove-WmiObject.*Shadow)"
    tags: [defense_evasion, impact, t1490]

  - name: defender_tamper
    pattern: "(Set-MpPreference|Add-MpPreference.*Exclusion|DisableRealtimeMonitoring|MpCmdRun)"
    tags: [defense_evasion, t1562.001]

  # ─── Discovery / Recon ────────────────────────────────────────────────────
  - name: host_recon
    pattern: "\\b(whoami|net\\s+user|net\\s+group|net\\s+localgroup|systeminfo|ipconfig\\s+/all)\\b"
    tags: [recon, discovery, t1082]

  - name: network_recon
    pattern: "\\b(arp\\s+-a|netstat\\s+-an|route\\s+print|nltest\\s+/dclist|nbtstat)\\b"
    tags: [recon, discovery, t1018]

  # ─── Lateral movement ─────────────────────────────────────────────────────
  - name: smb_admin_share
    pattern: "\\\\\\\\[^\\\\]+\\\\(ADMIN\\$|C\\$|IPC\\$)"
    tags: [lateral, t1021.002]

  - name: rdp_session
    pattern: "(TerminalServices-RemoteConnectionManager|RemoteDesktopServices|mstsc)"
    fields: [Channel, MapDescription, description]
    tags: [lateral, t1021.001]

  # ─── Exfiltration / C2 ────────────────────────────────────────────────────
  - name: cloud_exfil
    pattern: "(rclone|megaupload|mega\\.nz|anonfiles|transfer\\.sh|pastebin\\.com|ghostbin)"
    tags: [exfil, c2, t1567]

  - name: dns_tunneling_tools
    pattern: "(dnscat|iodine|sliver|heyserial)"
    tags: [exfil, c2, t1071.004]

  - name: beaconing_frameworks
    pattern: "\\b(cobaltstrike|metasploit|beacon|havoc|brute\\s*ratel|mythic)\\b"
    tags: [c2, critical, t1071.001]

  # ─── Impact ───────────────────────────────────────────────────────────────
  - name: ransomware_markers
    pattern: "(\\.lockbit|\\.conti|\\.ryk|\\.wncry|\\.locked|README_FOR_DECRYPT|HOW_TO_DECRYPT|HELP_DECRYPT)"
    tags: [impact, critical, t1486]

  - name: bcdedit_tamper
    pattern: "(bcdedit.*recoveryenabled\\s+no|bcdedit.*bootstatuspolicy\\s+ignoreallfailures)"
    tags: [impact, defense_evasion, t1490]

  # ─── Collection / staging ─────────────────────────────────────────────────
  - name: archive_staging
    pattern: "\\b(7za?\\.exe|winrar\\.exe|rar\\.exe|Compress-Archive).*(\\.zip|\\.rar|\\.7z|\\.cab)\\b"
    tags: [collection, exfil, t1560.001]

  # ─── Suspicious paths / file extensions ───────────────────────────────────
  - name: temp_exec_path
    pattern: "(\\\\\\\\Users\\\\\\\\[^\\\\]+\\\\\\\\AppData\\\\\\\\Local\\\\\\\\Temp\\\\\\\\[^\\\\]+\\\\.(exe|dll|ps1|bat|vbs|js))"
    tags: [exec, suspicious]

  - name: recycle_bin_exec
    pattern: "(\\$Recycle\\.Bin\\\\\\\\.*\\\\.(exe|dll|ps1|bat))"
    tags: [suspicious, defense_evasion]

  - name: double_extension
    pattern: "\\.(pdf|doc|docx|xls|xlsx|jpg|png)\\.(exe|scr|vbs|js|bat|cmd|lnk)\\b"
    tags: [suspicious, phishing]

  # ─── Execution / LOLBins (suite) ──────────────────────────────────────────
  - name: regsvr32_squiblydoo
    pattern: "(regsvr32\\s+/s\\s+/n\\s+/u\\s+/i:https?://|regsvr32\\s+/i:https?://)"
    tags: [exec, defense_evasion, t1218.010]

  - name: mshta_remote
    pattern: "(mshta\\s+https?://|mshta\\s+(vbscript|javascript):)"
    tags: [exec, defense_evasion, t1218.005]

  - name: cmstp_lolbin
    pattern: "(cmstp\\s+/ni\\s+/s|cmstp\\s+.*\\.inf)"
    tags: [exec, defense_evasion, t1218.003]

  - name: pcalua_lolbin
    pattern: "\\bpcalua\\.exe\\b"
    tags: [exec, defense_evasion, t1218.011]

  - name: rundll32_script
    pattern: "rundll32\\s+(javascript|vbscript):"
    tags: [exec, defense_evasion, t1218.011]

  - name: msiexec_remote
    pattern: "msiexec\\s+/(i|a)\\s+https?://"
    tags: [exec, t1218.007]

  - name: python_exec
    pattern: "(python\\d*\\.exe\\s+-c\\s|pip\\s+install\\s+-r\\s)"
    tags: [exec, t1059.006]

  - name: java_jar
    pattern: "\\bjava\\.exe\\s+-jar\\b"
    tags: [exec, t1059.007]

  - name: powershell_hidden
    pattern: "(powershell[^\\n]*-(windowstyle|w)\\s+hidden|-nop\\s+-w\\s+hidden)"
    tags: [exec, defense_evasion, t1059.001]

  - name: amsi_bypass
    pattern: "(AmsiInitFailed|amsi\\s*utils|Disable-Amsi|ByPass\\s+AMSI|amsi\\s+bypass)"
    tags: [defense_evasion, t1562.001]

  - name: certutil_download
    pattern: "(certutil\\s+-urlcache\\s+-split\\s+-f|certutil\\s+-decode\\s+\\S+\\.(exe|dll|ps1))"
    tags: [exec, defense_evasion, t1105]

  # ─── Credential access (suite) ────────────────────────────────────────────
  - name: lsass_dump
    pattern: "(procdump\\s+.*lsass|comsvcs\\.dll.*(MiniDump|dump)|rundll32.*comsvcs|lsass\\.exe\\s+\\d+\\s+dump)"
    tags: [credential, critical, t1003.001]

  - name: sam_hive_dump
    pattern: "(reg\\s+save\\s+\\S*\\\\(SAM|SYSTEM)\\b|secretsdump|sam\\.hive|ntds\\.dit.*(copy|download))"
    tags: [credential, t1003.002]

  - name: credential_manager
    pattern: "(cmdkey\\s+/list|vaultcmd\\s+/listcreds|Windows\\s+Credential\\s+Manager)"
    tags: [credential, t1003.005]

  - name: dpapi_theft
    pattern: "(\\bDPAPI\\b|CryptUnprotectData|master\\s+key\\s+file)"
    tags: [credential, t1555.004]

  - name: wifi_cred_theft
    pattern: "(netsh\\s+wlan\\s+show\\s+profile\\s+\\S+\\s+key=clear|Get-WlanProfile)"
    tags: [credential, t1555]

  - name: password_cracking
    pattern: "(\\bhashcat\\b|oclhashcat|john\\s+the\\s+ripper|\\bjohn\\.exe\\b)"
    tags: [credential, t1110.002]

  - name: keylogger
    pattern: "(GetAsyncKeyState|SetWindowsHookEx.*WH_KEYBOARD|\\bkeylog\\b)"
    tags: [credential, t1056.001]

  - name: browser_cred_theft
    pattern: "(\\bLogin\\s+Data\\b|Cookies\\.sqlite|Saved\\s+Passwords)"
    tags: [credential, t1555.003]

  - name: golden_silver_ticket
    pattern: "(\\bkrbtgt\\b|golden\\s+ticket|silver\\s+ticket|ticketer\\.py|\\bkekeo\\b)"
    tags: [credential, critical, t1558.001]

  - name: ntlm_relay
    pattern: "(ntlmrelayx|responder\\.py|multi\\s*relay)"
    tags: [credential, lateral, t1557.001]

  - name: impacket_suite
    pattern: "(impacket|wmiexec\\.py|smbexec\\.py|atexec\\.py|dcomexec\\.py|secretsdump\\.py|crackmapexec|netexec)"
    tags: [credential, lateral, t1021.006]

  - name: lsassy
    pattern: "\\blsassy\\b"
    tags: [credential, t1003.001]

  # ─── Persistence (suite) ──────────────────────────────────────────────────
  - name: startup_folder
    pattern: "(\\\\Startup\\\\|Start\\s+Menu\\\\Programs\\\\Startup)"
    tags: [persist, t1547.001]

  - name: ifeo_debugger
    pattern: "(Image\\s+File\\s+Execution\\s+Options|\\\\IFEO\\\\|GlobalFlag.*Debugger)"
    tags: [persist, defense_evasion, t1546.012]

  - name: screensaver_persist
    pattern: "SCRNSAVE\\.EXE\\s*="
    tags: [persist, t1546.002]

  - name: netsh_helper
    pattern: "(netsh\\s+add\\s+helper|netsh\\s+add\\s+portproxy)"
    tags: [persist, t1546.007]

  - name: new_account
    pattern: "(net\\s+user\\s+\\S+\\s+/add|New-LocalUser|Add-LocalGroupMember.*Administrators)"
    tags: [persist, t1136.001]

  - name: ssh_key_backdoor
    pattern: "(authorized_keys|sshd_config.*PermitRootLogin)"
    tags: [persist, t1098.004]

  - name: office_addin
    pattern: "(\\.wll\\b|\\.xll\\b|\\.vsto\\b|Office\\s+Add-?In)"
    tags: [persist, t1137]

  - name: boot_execute
    pattern: "(BootExecute\\s*=|Session\\s+Manager.*BootExecute)"
    tags: [persist, t1547.001]

  # ─── Defense evasion (suite) ──────────────────────────────────────────────
  - name: auditpol_disable
    pattern: "(auditpol\\s+/set\\s+/(success|failure):disable|auditpol\\s+/clear)"
    tags: [defense_evasion, t1562.002]

  - name: firewall_disable
    pattern: "(netsh\\s+advfirewall\\s+set\\s+allprofiles\\s+state\\s+off|Disable-NetFirewallRule|Set-NetFirewallProfile.*Disabled)"
    tags: [defense_evasion, t1562.004]

  - name: sysmon_disable
    pattern: "(sysmon\\s+-u\\b|Remove-Sysmon|sysmon\\s+-c\\s+\\S+\\s+--)"
    tags: [defense_evasion, t1562.006]

  - name: etw_patch
    pattern: "(EtwTi|PatchEtw|etw\\s+patch|etw\\s+bypass)"
    tags: [defense_evasion, t1562.006]

  - name: timestomping
    pattern: "(Set-ItemProperty.*(LastWriteTime|CreationTime)|timestomp|BashTimestamp|touch\\s+-d\\s)"
    tags: [defense_evasion, t1070.006]

  - name: process_injection
    pattern: "(CreateRemoteThread|VirtualAllocEx|NtMapViewOfSection|WriteProcessMemory|QueueUserAPC|NtCreateThreadEx)"
    tags: [defense_evasion, exec, t1055]

  - name: token_impersonation
    pattern: "(SeDebugPrivilege|DuplicateTokenEx|impersonate\\s+token|Incognito.*token)"
    tags: [privesc, t1134.001]

  - name: uac_bypass
    pattern: "(fodhelper|sdclt\\.exe|computerdefaults|eventvwr\\s+/v|bypassuac)"
    tags: [privesc, defense_evasion, t1548.002]

  - name: attrib_hiding
    pattern: "(attrib\\s+\\+h\\s|Set-ItemProperty.*Hidden\\s+\\$true)"
    tags: [defense_evasion, t1564.001]

  - name: ads_stream
    pattern: "(:\\$DATA|:Zone\\.Identifier|NTFS\\s+ADS)"
    tags: [defense_evasion, t1564.004]

  # ─── Discovery / recon (suite) ────────────────────────────────────────────
  - name: domain_admin_enum
    pattern: "(net\\s+group\\s+.*Domain\\s+Admins|dsquery\\s+group|Get-ADGroup.*Domain\\s+Admins)"
    tags: [recon, discovery, t1087.002]

  - name: ad_tooling
    pattern: "(adfind|sharphound|bloodhound|LDAPSearch|Invoke-Kerberoast)"
    tags: [recon, discovery, t1087.002]

  - name: gpo_enum
    pattern: "(gpresult\\s+/r|Get-GPO\\s+-All)"
    tags: [recon, discovery, t1615]

  - name: share_enum
    pattern: "(net\\s+view\\s+\\\\|Get-SmbShare|\\bnet\\s+share\\b)"
    tags: [recon, discovery, t1135]

  - name: process_enum
    pattern: "(tasklist\\s+/v|Get-Process\\s+-Name|qprocess)"
    tags: [recon, discovery, t1057]

  - name: file_dir_enum
    pattern: "(dir\\s+[A-Z]:\\\\ /s|Get-ChildItem\\s+-Path\\s+[A-Z]:\\\\ -Recurse|tree\\s+[A-Z]:\\\\ /f)"
    tags: [recon, discovery, t1083]

  # ─── Lateral movement (suite) ─────────────────────────────────────────────
  - name: wmic_remote_exec
    pattern: "(wmic\\s+/node:|wmic\\s+process\\s+call\\s+create|Invoke-WmiMethod\\s+-ComputerName)"
    tags: [lateral, exec, t1047]

  - name: winrm_lateral
    pattern: "(winrs\\s+-r:|evil-winrm|Enter-PSSession\\s+-ComputerName|Invoke-Command\\s+-ComputerName|New-PSSession\\s+-ComputerName|WinRM\\s+quickconfig)"
    tags: [lateral, t1021.006]

  - name: dcom_lateral
    pattern: "(dcomexec|MMC20\\.Application|DcomLaunch|GetTypeFromProgID.*MMC20)"
    tags: [lateral, exec, t1021.003]

  - name: ssh_lateral
    pattern: "(ssh\\.exe\\s+[\\w.-]+@|plink\\.exe\\s+-ssh|ssh\\s+-p\\s+\\d+\\s+[\\w.-]+@)"
    tags: [lateral, t1021.004]

  - name: vnc_remote
    pattern: "(tightvnc|realvnc|vncserver|\\bvnc\\.exe\\b)"
    tags: [lateral, t1021.005]

  - name: rdp_logon
    pattern: "(LogonType\\s*[:=]\\s*10\\b|TerminalServices.*logon)"
    tags: [lateral, t1021.001]

  # ─── Exfiltration / C2 (suite) ────────────────────────────────────────────
  - name: tunneling_tools
    pattern: "(chisel\\.exe|frpc?\\.exe|ligolo|nps\\.exe|rathole|n2n)"
    tags: [c2, exfil, t1090.001]

  - name: ssh_tunnel
    pattern: "(ssh\\s+-[LRD]\\s|plink\\s+-[LRD]\\s|ssh\\.exe.*-L\\s+\\d+)"
    tags: [c2, exfil, t1572]

  - name: socat_ncat
    pattern: "(\\bsocat\\b|\\bncat\\b|netcat|nc\\s+-l[vp])"
    tags: [c2, t1105]

  - name: webhook_c2
    pattern: "(discord(app)?\\.com/api/webhooks|slack\\.com/api/|api\\.telegram\\.org/bot|ntfy\\.sh)"
    tags: [c2, exfil, t1102]

  - name: email_exfil
    pattern: "(Send-MailMessage\\s+-To|mailto:\\S+@)"
    tags: [exfil, t1048.003]

  - name: ftp_exfil
    pattern: "(ftp\\.exe\\s+-s:|curl\\s+-T\\s|Invoke-WebRequest.*-Method\\s+Put)"
    tags: [exfil, t1048.002]

  - name: tor_usage
    pattern: "(\\btor\\.exe\\b|\\bproxychains\\b|\\btails\\b)"
    tags: [c2, t1090.003]

  # ─── Impact (suite) ───────────────────────────────────────────────────────
  - name: disk_wipe
    pattern: "(format\\s+[A-Z]:|diskpart\\s+/s.*clean|cipher\\s+/w|dd\\s+if=/dev/zero)"
    tags: [impact, t1485]

  - name: shutdown_abuse
    pattern: "(shutdown\\s+-[rs]\\s+-t\\s+0|Stop-Computer\\s+-Force)"
    tags: [impact, t1529]

  - name: data_destruction
    pattern: "(sdelete\\.exe|Remove-Item\\s+-Recurse\\s+-Force.*Recycle|cipher\\s+/w)"
    tags: [impact, t1485]

  - name: service_stop
    pattern: "(net\\s+stop\\s+\\S+|sc\\s+stop\\s+|Stop-Service\\s+-Name)"
    tags: [impact, t1489]

  # ─── Collection (suite) ───────────────────────────────────────────────────
  - name: clipboard_capture
    pattern: "(Get-Clipboard|\\bClipboardViewer\\b)"
    tags: [collection, credential, t1115]

  - name: screen_capture
    pattern: "(PrintWindow|CopyFromScreen|nircmd\\s+savescreenshot|\\bscreenshot\\b)"
    tags: [collection, t1113]

  - name: email_collection
    pattern: "(\\.pst\\b|\\.ost\\b|Get-Mailbox\\s+-Export|Search-Mailbox)"
    tags: [collection, t1114.002]

  - name: sensitive_file_touch
    pattern: "(id_rsa|id_ed25519|/etc/shadow|/etc/passwd|\\.ssh\\b)"
    tags: [collection, credential, t1005]

  # ─── Initial access / phishing (suite) ────────────────────────────────────
  - name: office_macro
    pattern: "(Auto_?Open|Workbook_Open|Document_Open|AutoExec)"
    tags: [initial_access, phishing, t1204.002]

  - name: html_smuggling
    pattern: "(data:text/html[^\\n]{0,200}base64|HTML\\s+Smuggling)"
    tags: [defense_evasion, phishing, t1027.006]

  - name: iso_mount
    pattern: "(Mount-DiskImage|imdisk\\.exe|\\b\\.vhd\\b.*Mount)"
    tags: [initial_access, t1204.002]

  - name: webshell
    pattern: "(\\bwebshell\\b|cmd\\.aspx|shell\\.php|c99\\.php|r57\\.php|eval\\(\\$_POST)"
    tags: [initial_access, t1505.003]

  # ─── EVTX event IDs ───────────────────────────────────────────────────────
  - name: failed_logon
    pattern: "\\b4625\\b"
    tags: [credential, recon, t1110]

  - name: account_lockout
    pattern: "\\b4740\\b"
    tags: [recon, t1110]

  - name: service_installed_event
    pattern: "\\b7045\\b"
    tags: [persist, t1543.003]

  - name: ps_scriptblock_log
    pattern: "\\b4104\\b"
    tags: [exec, t1059.001]

  - name: audit_log_cleared
    pattern: "\\b1102\\b"
    tags: [defense_evasion, t1070.001]

  - name: privilege_use
    pattern: "\\b4672\\b"
    tags: [privesc]

  # ─── Timesketch tagger (AllthingsTimesketch tags.yaml, J Marasinghe) ──────
  # Ported queries: source_short:REG → types [registry]; source_short:EVTX →
  # types [evtx, sysmon, hayabusa]. Event-identifier rules rely on the raw EventId
  # being scanned; key_path/value rules match the raw KeyPath/ValueData text.
  - name: ts_win_usrprofile
    pattern: "ProfileList"
    types: [registry]
    tags: [win-user-profiles, Info]

  - name: ts_powershell_mimikatz
    pattern: "(System\\.Reflection\\.AssemblyName|System\\.Runtime\\.InteropServices\\.MarshalAsAttribute|SE_PRIVILEGE_ENABLED|TOKEN_PRIVILEGES)"
    types: [evtx, sysmon, hayabusa]
    tags: [win-mimikatz, T1003, Credential-Access, High]

  - name: ts_defender_disabled_events
    pattern: "\\b(5001|5010|5012)\\b"
    types: [evtx, sysmon, hayabusa]
    tags: [win-defender, T1562, Defense-Evasion, Medium]

  - name: ts_firewall_rules
    pattern: "(FirewallRules|\\b2005\\b)"
    types: [registry, evtx, sysmon, hayabusa]
    tags: [win-firewall, T1562, Defense-Evasion, Medium]

  - name: ts_uac_disabled
    pattern: "EnableLUA"
    types: [registry]
    tags: [win-uac, T1548, Defense-Evasion, High]

  - name: ts_sticky_key
    pattern: "(Image\\s+File\\s+Execution\\s+Options.*Debugger|IFEO.*Debugger)"
    types: [registry]
    tags: [win-sticky, T1183, Persistence, High]

  - name: ts_bits_download
    pattern: "(Start-BitsTransfer|bitsadmin\\s+/transfer)"
    tags: [win-bitstransfer, T1197, Persistence, High]

  - name: ts_logon_failures
    pattern: "\\b(4625|4740|4776|4767)\\b"
    types: [evtx, sysmon, hayabusa]
    tags: [win-logonfailures, T1110, Credential-Access, Medium]

  - name: ts_bloodhound
    pattern: "(Invoke-BloodHound|Get-BloodHoundData|SharpHound|CollectionMethod\\s+All|\\bDCOnly\\b)"
    tags: [win-bloodhound, T1482, Discovery, High]

  - name: ts_postexploit_framework
    pattern: "(Meterpreter|Metasploit|PowerSploit|MeteTool|MPreter|Swrort|Rozena|Backdoor\\.Cobalt)"
    tags: [win-postexploit, T1219, Command-and-Control, High]

  - name: ts_execution_indicators
    pattern: "(MUICache|LastVisited.*MRU)"
    types: [registry]
    tags: [win-execution, T1204, Execution, User-Execution, Medium]

  - name: ts_cred_dumper
    pattern: "(PWDump|DumpCreds|PWCrack|PSWtool|PShlSpy|SecurityTool)"
    tags: [win-credump, T1003, Credential-Access, High]

  - name: ts_powershell_web
    pattern: "(Invoke-WebRequest|Net\\.WebClient|Start-BitsTransfer|\\bwget\\b|\\bcurl\\b)"
    tags: [win-powershell-webreq, T1059.001, Execution, High]

  - name: ts_wireless_activity
    pattern: "\\b(8001|8003|8005|8006|8008)\\b"
    types: [evtx, sysmon, hayabusa]
    tags: [win-wireless, T1200, Wireless, Medium]

  - name: ts_bluekeep_scan
    pattern: "AAAAAAA"
    tags: [win-bluekeep, T1595, Bluekeep, Scan, High]

  - name: ts_minint_seclog_disabled
    pattern: "MiniNt"
    types: [registry]
    tags: [win-regseclogdis, T1562.002, Defense-Evasion, Security Log Disabled, High]

  - name: ts_smbexec
    pattern: "(BTOBTO|execute\\.bat)"
    types: [evtx, sysmon, hayabusa]
    tags: [win-smbexec, T1021.002, Impacket, Lateral-Movement, High]

  - name: ts_macro_trustrecord
